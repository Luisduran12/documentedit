# Entorno local OPCIONAL para pruebas sin cuentas reales:
# Postgres + proxy HTTP compatible con Neon, y MinIO como sustituto S3 de R2.
# Uso: docker compose -f dev/docker-compose.yml up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: main
    ports: ["54329:5432"]
  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/main
    ports: ["4444:4444"]
    depends_on: [postgres]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9100:9000", "9101:9001"]
